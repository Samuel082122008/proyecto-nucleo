<div class="login">
  <img class="fondo" src="campus.jpg" alt=""
       (error)="$any($event.target).style.display = 'none'" />
  <div class="velo"></div>

  <button type="button" class="btn-tema flotante" (click)="tema.alternar()"
          [attr.aria-label]="tema.esOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <i class="fa-solid" [class.fa-moon]="!tema.esOscuro" [class.fa-sun]="tema.esOscuro"></i>
  </button>

  <form class="tarjeta" (ngSubmit)="ingresar()">
    <div class="logo-caja">
      <img class="logo" src="logo.png" alt="Universidad El Bosque" />
    </div>

    <h1>Gestión de horarios</h1>
    <p class="sub">Ingresa con tu usuario para continuar</p>

    <label>
      Usuario
      <input name="username" [(ngModel)]="username" autocomplete="username"
             placeholder="Tu usuario" />
    </label>

    <label>
      Contraseña
      <input name="password" type="password" [(ngModel)]="password"
             autocomplete="current-password" placeholder="••••••••" />
    </label>

    @if (error) { <p class="error">{{ error }}</p> }

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
