<div class="page">
  <h2>Usuarios</h2>

  <form class="form" (ngSubmit)="guardar()">
    <input name="username" placeholder="Usuario" [(ngModel)]="form.username" />

    <input name="password" type="password"
           [placeholder]="editando ? 'Nueva contraseña (opcional)' : 'Contraseña'"
           [(ngModel)]="form.password" autocomplete="new-password" />

    <select name="rol" [(ngModel)]="form.rol">
      @for (r of roles; track r) {
        <option [value]="r">{{ r }}</option>
      }
    </select>

    @if (form.rol === 'DOCENTE') {
      <select name="docenteId" [(ngModel)]="form.docenteId">
        <option [ngValue]="null">-- Docente --</option>
        @for (d of docentes; track d.id) {
          <option [ngValue]="d.id">{{ d.nombre }}</option>
        }
      </select>
    }

    <button type="submit">{{ editando ? 'Actualizar' : 'Crear' }}</button>
    @if (editando) {
      <button type="button" class="secundario" (click)="cancelar()">Cancelar</button>
    }
  </form>

  @if (error) { <p class="error">{{ error }}</p> }

  <table>
    <thead>
    <tr><th>ID</th><th>Usuario</th><th>Rol</th><th>Docente</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      @for (u of usuarios; track u.id) {
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.rol }}</td>
          <td>{{ nombreDocente(u.docenteId) }}</td>
          <td>
            <button (click)="editar(u)">Editar</button>
            <button class="peligro" (click)="eliminar(u)">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5">No hay usuarios registrados</td></tr>
      }
    </tbody>
  </table>
</div>
