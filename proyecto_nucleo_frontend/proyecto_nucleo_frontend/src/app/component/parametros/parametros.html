<div class="page">
  <h2>Parámetros del semestre</h2>

  <form class="grid" (ngSubmit)="guardar()">
    <label>Cupo mínimo
      <input name="cupoMinimo" type="number" min="1" [(ngModel)]="form.cupoMinimo" />
    </label>
    <label>Cupo máximo
      <input name="cupoMaximo" type="number" min="1" [(ngModel)]="form.cupoMaximo" />
    </label>
    <label>Tolerancia de cupo
      <input name="toleranciaCupo" type="number" min="0" [(ngModel)]="form.toleranciaCupo" />
    </label>

    <label>Franja inicio
      <input name="franjaInicio" type="time" [(ngModel)]="form.franjaInicio" />
    </label>
    <label>Franja fin
      <input name="franjaFin" type="time" [(ngModel)]="form.franjaFin" />
    </label>
    <label>Fin sábado
      <input name="sabadoFin" type="time" [(ngModel)]="form.sabadoFin" />
    </label>

    <label>Almuerzo inicio
      <input name="almuerzoInicio" type="time" [(ngModel)]="form.almuerzoInicio" />
    </label>
    <label>Almuerzo fin
      <input name="almuerzoFin" type="time" [(ngModel)]="form.almuerzoFin" />
    </label>

    <label>Sesiones máx. por semana
      <input name="sesionesMaxSemana" type="number" min="1" [(ngModel)]="form.sesionesMaxSemana" />
    </label>
    <label>Duración de sesión (horas)
      <input name="duracionSesionHoras" type="number" min="1" [(ngModel)]="form.duracionSesionHoras" />
    </label>

    <div class="acciones"><button type="submit">Guardar</button></div>
  </form>

  @if (mensaje) { <p class="ok">{{ mensaje }}</p> }
  @if (error) { <p class="error">{{ error }}</p> }
</div>
